<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reproductor</title>
<script defer src="/_vercel/insights/script.js"></script>
<style>
  :root{
    --bg:#040405;
    --panel:#0c0c0f;
    --line-dim:#4a4a52;
    --line-past:#6f6f78;
    --line-active:#f5f2ee;
    --accent-a:#c9a3ff;
    --accent-b:#ff9db6;
    --accent-c:#8fd7ff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:radial-gradient(120% 120% at 20% 0%, #101014 0%, #040405 55%);
    color:var(--line-active);
    font-family:'Helvetica Neue',Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }

  .app{
    width:100%;
    max-width:1100px;
    height:min(700px,90vh);
    background:var(--panel);
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 40px 100px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.04);
    position:relative;
  }

  /* ================= BIBLIOTECA (MENÚ DE CANCIONES) ================= */
  .library{
    position:absolute;inset:0;
    display:flex;
    flex-direction:column;
    padding:40px 48px;
    overflow-y:auto;
  }
  .library.hidden{display:none;}

  .library-header{
    font-size:28px;
    font-weight:800;
    letter-spacing:-.02em;
    margin-bottom:6px;
  }
  .library-sub{
    font-size:14px;
    color:var(--line-past);
    margin-bottom:28px;
  }

  .track-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
    gap:24px;
  }

  .track-card{
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .track-card-art{
    width:100%;
    aspect-ratio:1/1;
    border-radius:14px;
    background-size:cover;
    background-position:center;
    box-shadow:0 16px 32px rgba(0,0,0,.5);
    transition:transform .2s ease;
  }
  .track-card:hover .track-card-art{transform:translateY(-4px);}
  .track-card:active .track-card-art{transform:scale(.97);}
  .track-card-title{
    margin-top:10px;
    font-size:14px;
    font-weight:700;
    line-height:1.3;
  }
  .track-card-artist{
    font-size:12px;
    color:var(--line-past);
    margin-top:2px;
  }

  /* ================= REPRODUCTOR (PLAYER) ================= */
  .player{
    position:absolute;inset:0;
    display:grid;
    grid-template-columns:1fr 1.3fr;
  }
  .player.hidden{display:none;}

  .back-btn{
    position:absolute;
    top:20px;left:20px;
    z-index:5;
    width:36px;height:36px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.08);
    color:var(--line-active);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .back-btn:active{background:rgba(255,255,255,.16);}
  .back-btn svg{width:18px;height:18px;}

  /* ---------- LADO IZQUIERDO: PORTADA ---------- */
  .cover-side{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:48px 40px;
    background:
      radial-gradient(80% 60% at 50% 0%, rgba(201,163,255,.15), transparent 60%),
      linear-gradient(180deg,#0a0a0d,#050506);
  }

  .cover-art{
    width:78%;
    aspect-ratio:1/1;
    border-radius:16px;
    position:relative;
    overflow:hidden;
    box-shadow:0 30px 60px rgba(0,0,0,.55);
    background-size:cover;
    background-position:center;
  }

  .track-title{
    margin-top:28px;
    font-size:20px;
    font-weight:700;
    text-align:center;
    letter-spacing:-.01em;
  }
  .track-artist{
    margin-top:6px;
    font-size:14px;
    color:var(--line-past);
    text-align:center;
  }

  /* ---------- controles ---------- */
  .controls{
    width:100%;
    margin-top:36px;
  }
  .seek{
    -webkit-appearance:none;
    width:100%;
    height:4px;
    border-radius:2px;
    background:linear-gradient(90deg,var(--accent-a) var(--progress,0%),rgba(255,255,255,.15) 0);
    outline:none;
    cursor:pointer;
    touch-action:none;
  }
  .seek::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px;height:16px;border-radius:50%;
    background:#fff;
    box-shadow:0 0 0 4px rgba(255,255,255,.08);
  }
  .seek::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;
    background:#fff;border:none;
    box-shadow:0 0 0 4px rgba(255,255,255,.08);
  }
  .time-row{
    display:flex;justify-content:space-between;
    font-size:11px;color:var(--line-past);
    margin-top:6px;
    font-variant-numeric:tabular-nums;
  }
  .transport{
    display:flex;align-items:center;justify-content:center;
    gap:28px;
    margin-top:18px;
  }
  .transport button{
    background:none;border:none;color:var(--line-active);
    cursor:pointer;padding:6px;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease, opacity .15s ease;
  }
  .transport button:hover{opacity:.75;}
  .transport button:active{transform:scale(.9);}
  #playBtn{
    width:52px;height:52px;border-radius:50%;
    background:var(--line-active);color:#000;
  }
  #playBtn svg{width:20px;height:20px;}
  .transport svg{width:22px;height:22px;}

  /* ---------- LADO DERECHO: LETRA ---------- */
  .lyrics-side{
    position:relative;
    padding:0 56px;
    overflow:hidden;
    display:flex;
    align-items:center;
  }
  .lyrics-side::before,
  .lyrics-side::after{
    content:"";
    position:absolute;left:0;right:0;height:120px;
    z-index:2;pointer-events:none;
  }
  .lyrics-side::before{top:0;background:linear-gradient(var(--panel),transparent);}
  .lyrics-side::after{bottom:0;background:linear-gradient(transparent,var(--panel));}

  .lyrics-scroll{
    width:100%;
    max-height:100%;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding:44% 0;
  }
  .lyrics-scroll::-webkit-scrollbar{display:none;}

  .lyric-line{
    font-size:26px;
    font-weight:700;
    line-height:1.5;
    color:var(--line-dim);
    filter:blur(2px);
    transform-origin:left center;
    transform:scale(.94);
    transition:color .4s ease, filter .4s ease, transform .4s ease, opacity .4s ease;
    padding:6px 0;
    opacity:.5;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .lyric-line.past{color:var(--line-past);filter:blur(0);opacity:.55;transform:scale(.97);}
  .lyric-line.active{
    color:var(--line-active);
    filter:blur(0);
    opacity:1;
    transform:scale(1.04);
    background:linear-gradient(90deg,var(--accent-a),var(--accent-b) 60%,var(--accent-c));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  .hint{
    position:absolute;
    top:18px;right:24px;
    font-size:11px;
    color:var(--line-dim);
    z-index:3;
    max-width:260px;
    text-align:right;
    line-height:1.4;
  }

  @media (max-width:760px){
    body{
      padding:0;
      align-items:stretch;
      min-height:100dvh;
    }
    .app{
      width:100%;
      height:100dvh;
      max-height:none;
      border-radius:0;
    }
    .library{padding:28px 22px;}
    .library-header{font-size:22px;}
    .track-grid{
      grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));
      gap:18px;
    }
    .player{
      grid-template-columns:1fr;
      grid-template-rows:auto 1fr;
    }
    .cover-side{
      padding:28px 24px 20px;
      flex-shrink:0;
    }
    .cover-art{width:56%;max-width:220px;}
    .track-title{font-size:18px;margin-top:20px;}
    .track-artist{font-size:13px;}
    .controls{margin-top:22px;}
    .transport{gap:24px;}
    #playBtn{width:48px;height:48px;}
    .lyrics-side{
      padding:0 24px 24px;
      min-height:0;
    }
    .lyrics-scroll{padding:40% 0;}
    .lyric-line{font-size:20px;line-height:1.45;}
    .hint{
      position:static;
      display:block;
      max-width:none;
      text-align:left;
      margin-bottom:10px;
    }
  }

  @media (max-width:400px){
    .cover-art{width:48%;max-width:180px;}
    .lyric-line{font-size:18px;}
  }
</style>
</head>
<body>

<div class="app">

  <!-- ===== BIBLIOTECA: MENÚ PARA ELEGIR CANCIÓN ===== -->
  <div class="library" id="library">
    <div class="library-header">Tu música</div>
    <div class="library-sub">Elige una canción para reproducir</div>
    <div class="track-grid" id="trackGrid"></div>
  </div>

  <!-- ===== REPRODUCTOR ===== -->
  <div class="player hidden" id="player">
    <button class="back-btn" id="backBtn" title="Volver">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 4l-8 8 8 8 1.5-1.5L10.5 12l6.5-6.5z"/></svg>
    </button>

    <!-- IZQUIERDA: PORTADA + CONTROLES -->
    <div class="cover-side">
      <div class="cover-art" id="coverArt"></div>
      <div class="track-title" id="trackTitle"></div>
      <div class="track-artist" id="trackArtist"></div>

      <div class="controls">
        <input type="range" class="seek" id="seek" value="0" min="0" max="100" step="0.1">
        <div class="time-row">
          <span id="curTime">0:00</span>
          <span id="durTime">0:00</span>
        </div>
        <div class="transport">
          <button id="prevBtn" title="Anterior">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l9-6v12z"/></svg>
          </button>
          <button id="playBtn" title="Reproducir">
            <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button id="nextBtn" title="Siguiente">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4.5 6l9 6-9 6z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- DERECHA: LETRA SINCRONIZADA -->
    <div class="lyrics-side">
      <div class="hint">Un regalito que hice para ti c:</div>
      <div class="lyrics-scroll" id="lyricsScroll"></div>
    </div>
  </div>

</div>

<audio id="audio" preload="auto"></audio>

<script>
  // =====================================================================
  //  1) TUS CANCIONES VAN AQUÍ
  //  Cada canción es un objeto con: id, title, artist, cover, audio, lyrics
  //  - cover y audio son rutas dentro de /assets (sube ahí tus archivos)
  //  - lyrics sigue el mismo formato de siempre: { time, text }
  //  Para agregar una canción nueva, copia un bloque { ... } completo,
  //  cámbiale el id (único), y pon tus propios datos.
  // =====================================================================
  const TRACKS = [
    {
      id: 'how-much-longer',
      title: 'How Much Longer?',
      artist: 'Alexander 23',
      cover: 'Assets/Portada.jpg',
      audio: 'Assets/How-Much-Longer_.mp3',
      lyrics: [
        { time: 14,   text: "Lo intento tanto" },
        { time: 17,   text: "¿Te he asustado?" },
        { time: 23,   text: "Cuando lo deseo con todas mis fuerzas" },
        { time: 30,  text: "me pongo trabas a mí mismo." },
        { time: 36,  text: "Y te prometo con el meñique" },
        { time: 41,  text: "que puedo ser la persona de la que" },
        { time: 44,  text: "te enamoraste." },
        { time: 47,  text: "Pero, si soy sincero," },
        { time: 53,  text: "no veo hacia dónde correr." },
        { time: 60,  text: "¿Dónde te has ido, amor?" },
        { time: 63,  text: "¿Cómo te he perdido?" },
        { time: 66,  text: "¿Te he hecho daño?" },
        { time: 68,  text: "¿Estás enfadada?" },
        { time: 72,  text: "No hay nada que," },
        { time: 74,  text: "no haría,amor" },
        { time: 77,  text: "para recuperar lo que teníamos." },
        { time: 84,  text: "Y esperaría hasta el" },
        { time: 86,  text: "fin de los tiempos" },
        { time: 89,  text: "si me aceptaras," },
        { time: 92,  text: "con el corazón en la mano." },
        { time: 96,  text: "¿Y cuánto tiempo más puedo quererte" },
        { time: 102,  text: "cuando, cariño, tú no me quieres?" },
        { time: 119,  text: "Necesito saberlo" },
        { time: 123,  text: "¿Estoy empeorando las cosas?" },
        { time: 129, text: "Porque mi corazón roto" },
        { time: 135, text: "Nunca ha sufrido tanto" },
        { time: 140, text: "Oh, y te lo prometo con el meñique (oh, oh, oh-oh)" },
        { time: 148, text: "Puedo ser de quien te enamoraste (oh, oh, oh-oh)" },
        { time: 154, text: "Pero si soy sincero (oh, oh, oh-oh)" },
        { time: 160, text: "No veo hacia dónde correr (oh, oh)" },
        { time: 166, text: "¿Adónde te has ido, amor?" },
        { time: 169, text: "¿Cómo te he perdido?" },
        { time: 172, text: "¿Te he hecho daño?" },
        { time: 175, text: "¿Estás enfadada?" },
        { time: 178, text: "No hay nada que no haría, amor" },
        { time: 184, text: "Para recuperar lo que teníamos" },
        { time: 190, text: "Y esperaría hasta el fin de los tiempos" },
        { time: 196, text: "Si me aceptaras, con el corazón en la mano" },
        { time: 202, text: "¿Y cuánto tiempo más puedo quererte" },
        { time: 208, text: "Cuando, cariño, tú no me quieres?" },
        { time: 214, text: "¿Y cuánto tiempo más puedo quererte" },
        { time: 219, text: "Cuando, cariño, tú no me quieres?" },
      ]
    },
    {
      id: 'give-me-a-sign',
      title: 'Give Me a Sign',
      artist: 'Bryant Barnes',
      cover: 'Assets/Portada2.jpg',
      audio: 'Assets/Give-Me-A-Sign.mp3',
      lyrics: [
        { time: 14,   text: "Lo intento tanto" },
        { time: 17,   text: "¿Te he asustado?" },
      ]
    },
  ];

  // =====================================================================
  //  2) LÓGICA DE LA APP (no hace falta tocar nada de aquí en adelante)
  // =====================================================================
  const libraryEl = document.getElementById('library');
  const playerEl = document.getElementById('player');
  const trackGrid = document.getElementById('trackGrid');
  const backBtn = document.getElementById('backBtn');

  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const seek = document.getElementById('seek');
  const curTimeEl = document.getElementById('curTime');
  const durTimeEl = document.getElementById('durTime');
  const scrollWrap = document.getElementById('lyricsScroll');
  const coverArt = document.getElementById('coverArt');
  const trackTitleEl = document.getElementById('trackTitle');
  const trackArtistEl = document.getElementById('trackArtist');

  const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

  let LYRICS = [];
  let lineEls = [];
  let activeIndex = -1;

  // ---------- construir el menú de biblioteca ----------
  TRACKS.forEach((track) => {
    const card = document.createElement('div');
    card.className = 'track-card';
    card.innerHTML = `
      <div class="track-card-art" style="background-image:url('${track.cover}')"></div>
      <div class="track-card-title">${track.title}</div>
      <div class="track-card-artist">${track.artist}</div>
    `;
    card.addEventListener('click', () => openTrack(track));
    trackGrid.appendChild(card);
  });

  function openTrack(track){
    // datos visuales
    coverArt.style.backgroundImage = `url('${track.cover}')`;
    trackTitleEl.textContent = track.title;
    trackArtistEl.textContent = track.artist;

    // audio
    audio.pause();
    audio.src = track.audio;
    audio.load();
    playIcon.innerHTML = ICON_PLAY;
    seek.value = 0;
    seek.style.setProperty('--progress', '0%');
    curTimeEl.textContent = '0:00';
    durTimeEl.textContent = '0:00';

    // letra
    LYRICS = track.lyrics || [];
    activeIndex = -1;
    scrollWrap.innerHTML = '';
    LYRICS.forEach((line, i) => {
      const div = document.createElement('div');
      div.className = 'lyric-line';
      div.textContent = line.text;
      div.dataset.index = i;
      div.addEventListener('click', () => {
        audio.currentTime = line.time;
        if (audio.paused) togglePlay();
      });
      scrollWrap.appendChild(div);
    });
    lineEls = [...scrollWrap.querySelectorAll('.lyric-line')];

    // cambiar de vista
    libraryEl.classList.add('hidden');
    playerEl.classList.remove('hidden');
  }

  backBtn.addEventListener('click', () => {
    audio.pause();
    playIcon.innerHTML = ICON_PLAY;
    playerEl.classList.add('hidden');
    libraryEl.classList.remove('hidden');
  });

  function fmt(t){
    if (!isFinite(t)) return "0:00";
    const m = Math.floor(t/60);
    const s = Math.floor(t%60).toString().padStart(2,'0');
    return `${m}:${s}`;
  }

  function togglePlay(){
    if (audio.paused){
      audio.play().catch(()=>{});
      playIcon.innerHTML = ICON_PAUSE;
    } else {
      audio.pause();
      playIcon.innerHTML = ICON_PLAY;
    }
  }
  playBtn.addEventListener('click', togglePlay);

  document.getElementById('prevBtn').addEventListener('click', () => {
    audio.currentTime = Math.max(0, audio.currentTime - 10);
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    audio.currentTime = Math.min(audio.duration||0, audio.currentTime + 10);
  });

  audio.addEventListener('loadedmetadata', () => {
    seek.max = audio.duration;
    durTimeEl.textContent = fmt(audio.duration);
  });

  // ---------- control de la barra (arreglo de conflicto táctil) ----------
  let isSeeking = false;
  const seekStart = () => { isSeeking = true; };
  const seekEnd = () => { isSeeking = false; };

  seek.addEventListener('input', () => {
    if (!audio.duration) return;
    const target = parseFloat(seek.value);
    audio.currentTime = target;
    const pct = (target/audio.duration)*100;
    seek.style.setProperty('--progress', pct + '%');
    curTimeEl.textContent = fmt(target);
  });
  seek.addEventListener('mousedown', seekStart);
  seek.addEventListener('touchstart', seekStart, { passive: true });
  seek.addEventListener('mouseup', seekEnd);
  seek.addEventListener('touchend', seekEnd);
  seek.addEventListener('change', seekEnd);

  // ---------- control de la letra (arreglo de conflicto táctil) ----------
  let userTouchingLyrics = false;
  let userScrollTimeout = null;

  scrollWrap.addEventListener('touchstart', () => {
    userTouchingLyrics = true;
    if (userScrollTimeout) clearTimeout(userScrollTimeout);
  }, { passive: true });

  scrollWrap.addEventListener('touchend', () => {
    userScrollTimeout = setTimeout(() => { userTouchingLyrics = false; }, 1200);
  });

  function updateActiveLine(t){
    let idx = 0;
    for (let i=0;i<LYRICS.length;i++){
      if (t >= LYRICS[i].time) idx = i; else break;
    }
    if (idx !== activeIndex){
      activeIndex = idx;
      lineEls.forEach((el,i) => {
        el.classList.remove('active','past');
        if (i < idx) el.classList.add('past');
        if (i === idx) el.classList.add('active');
      });
      const activeEl = lineEls[idx];
      if (activeEl && !userTouchingLyrics){
        activeEl.scrollIntoView({ block:'center', behavior:'smooth' });
      }
    }
  }

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    if (!isSeeking){
      seek.value = audio.currentTime;
      const pct = (audio.currentTime/audio.duration)*100;
      seek.style.setProperty('--progress', pct + '%');
    }
    curTimeEl.textContent = fmt(audio.currentTime);
    updateActiveLine(audio.currentTime);
  });

  audio.addEventListener('ended', () => {
    playIcon.innerHTML = ICON_PLAY;
  });
</script>
</body>
</html>
